<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Successful - QuickView Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .success-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #10b981;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .success-icon i {
            font-size: 48px;
            color: white;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .redirect-note {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>🎉 Subscription Activated!</h1>
        <p>Your QuickView Pro Pro Seller plan is now active.<br>Return to the extension to access premium features.</p>
        <a href="#" id="openExtensionBtn" class="btn-primary">
            <i class="fab fa-chrome"></i> Open Extension
        </a>
        <p class="redirect-note" id="redirectNote">
            Redirecting automatically in <span id="countdown">5</span> seconds...
        </p>
    </div>

    <script>
        // Replace with your actual Chrome extension ID
        const EXTENSION_ID = 'YOUR_EXTENSION_ID';
        const EXTENSION_URL = `chrome-extension://${EXTENSION_ID}/sidebar.html`;
        
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');
        const redirectNote = document.getElementById('redirectNote');
        
        function tryOpenExtension() {
            // Try to open the extension
            window.location.href = EXTENSION_URL;
            
            // If extension doesn't open, show manual link after 1 second
            setTimeout(() => {
                redirectNote.innerHTML = `If the extension doesn't open automatically, <a href="${EXTENSION_URL}" style="color:#ff9900;">click here</a> to open it.`;
                redirectNote.style.color = '#ff9900';
            }, 1000);
        }
        
        function updateCountdown() {
            countdown--;
            countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(timer);
                tryOpenExtension();
            }
        }
        
        const timer = setInterval(updateCountdown, 1000);
        
        document.getElementById('openExtensionBtn').addEventListener('click', (e) => {
            e.preventDefault();
            clearInterval(timer);
            tryOpenExtension();
        });
        
        // Also try to send message to existing extension tabs
        try {
            chrome.runtime.sendMessage(EXTENSION_ID, { action: 'refreshSubscription' });
        } catch(e) {
            console.log('Extension not yet loaded');
        }
    </script>
</body>
</html>
