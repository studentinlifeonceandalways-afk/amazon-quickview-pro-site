<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header h1 { color: white; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .reset-header p { color: rgba(255,255,255,0.9); font-size: 14px; }
        .reset-body { padding: 32px 28px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-group input {
            width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s ease;
        }
        .input-group input:focus { outline: none; border-color: #ff9900; box-shadow: 0 0 0 3px rgba(255,153,0,0.1); }
        
        .error-message {
            background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #dc2626;
        }
        .success-message {
            background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #16a34a;
        }
        .info-message {
            background: #e0f2fe; color: #0284c7; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white; border: none; border-radius: 12px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(255,153,0,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .loading-spinner {
            display: inline-block; width: 16px; height: 16px; border: 2px solid white;
            border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-links { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eef2f6; }
        .footer-links a { color: #ff9900; text-decoration: none; font-size: 13px; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
        
        .token-status { font-size: 12px; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .token-valid { background: #dcfce7; color: #166534; }
        .token-invalid { background: #fee2e2; color: #991b1b; }
        
        .requirement-list { font-size: 11px; color: #64748b; margin-top: 8px; padding-left: 16px; list-style: none; }
        .requirement-list li { margin-bottom: 4px; padding-left: 20px; position: relative; }
        .requirement-list li.valid { color: #10b981; }
        .requirement-list li.valid::before { content: '✓'; position: absolute; left: 0; }
        .requirement-list li.invalid::before { content: '○'; position: absolute; left: 0; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your new password below</p>
        </div>
        
        <div class="reset-body">
            <div id="tokenStatus" class="token-status" style="display: none;"></div>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
            </div>
            
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
            </div>
            
            <ul class="requirement-list">
                <li id="req-length">At least 6 characters</li>
                <li id="req-match">Passwords match</li>
            </ul>
            
            <button id="resetBtn" class="btn-primary" disabled>Update Password</button>
            
            <div class="footer-links">
                <a href="#" id="requestNewLink">Request New Reset Link</a>
                <span style="margin: 0 8px; color: #cbd5e1;">|</span>
                <a href="#" id="backToExtension">Open Extension</a>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let tokenHash = null;
        
        // Extract token_hash from URL (this is the CORRECT format)
        function extractTokenHash() {
            // Try hash first
            let hash = window.location.hash.substring(1);
            let params = new URLSearchParams(hash);
            let token = params.get('token_hash');
            
            // Try query params
            if (!token) {
                let queryParams = new URLSearchParams(window.location.search);
                token = queryParams.get('token_hash');
            }
            
            // Try access_token (older format)
            if (!token) {
                token = params.get('access_token');
                if (!token && window.location.search) {
                    token = new URLSearchParams(window.location.search).get('access_token');
                }
            }
            
            console.log('[Reset] Token hash found:', !!token);
            console.log('[Reset] URL hash:', window.location.hash);
            console.log('[Reset] URL search:', window.location.search);
            
            if (token) {
                tokenHash = token;
                return true;
            }
            return false;
        }
        
        // Validate token and exchange for session
        async function validateAndGetSession() {
            if (!tokenHash) return null;
            
            try {
                console.log('[Reset] Validating token via verify endpoint...');
                
                // This is the CORRECT way to verify a recovery token
                const response = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'recovery',
                        token_hash: tokenHash
                    })
                });
                
                console.log('[Reset] Verify response status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    console.error('[Reset] Verify error:', error);
                    return null;
                }
                
                const session = await response.json();
                console.log('[Reset] Session obtained for:', session.user?.email);
                return session;
                
            } catch (error) {
                console.error('[Reset] Validation error:', error);
                return null;
            }
        }
        
        // Update password using the session
        async function updatePassword(newPassword, accessToken) {
            try {
                console.log('[Reset] Updating password...');
                
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                console.log('[Reset] Update response status:', response.status);
                
                if (response.ok) {
                    return true;
                }
                
                const error = await response.json();
                console.error('[Reset] Update error details:', error);
                
                if (response.status === 422) {
                    throw new Error('Password must be at least 6 characters');
                } else if (response.status === 403) {
                    throw new Error('Reset link has expired. Please request a new one.');
                } else {
                    throw new Error(error.message || error.error_description || 'Password update failed');
                }
                
            } catch (error) {
                console.error('[Reset] Update error:', error);
                throw error;
            }
        }
        
        // Validate password requirements
        function validatePassword(password, confirm) {
            const lengthValid = password.length >= 6;
            const matchValid = password === confirm && password !== '';
            const isValid = lengthValid && matchValid;
            return { isValid, lengthValid, matchValid };
        }
        
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            const { isValid, lengthValid, matchValid } = validatePassword(password, confirm);
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (lengthValid) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.classList.add('invalid');
            }
            
            if (matchValid) {
                matchReq.classList.add('valid');
                matchReq.classList.remove('invalid');
            } else {
                matchReq.classList.remove('valid');
                matchReq.classList.add('invalid');
            }
            
            resetBtn.disabled = !isValid;
        }
        
        function showTokenStatus(isValid, message, email = null) {
            const statusDiv = document.getElementById('tokenStatus');
            statusDiv.style.display = 'block';
            statusDiv.className = `token-status ${isValid ? 'token-valid' : 'token-invalid'}`;
            if (email && isValid) {
                statusDiv.innerHTML = `✅ ${message}<br><span style="font-size: 11px;">${email}</span>`;
            } else {
                statusDiv.innerHTML = isValid ? `✅ ${message}` : `❌ ${message}`;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 8000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 5000);
        }
        
        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const { isValid, lengthValid, matchValid } = validatePassword(newPassword, confirmPassword);
            
            if (!isValid) {
                if (!lengthValid) showError('Password must be at least 6 characters');
                else if (!matchValid) showError('Passwords do not match');
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            const originalText = resetBtn.innerHTML;
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                // First, validate the token and get a session
                const session = await validateAndGetSession();
                
                if (!session || !session.access_token) {
                    throw new Error('Invalid or expired reset link. Please request a new one.');
                }
                
                // Now update the password using the session token
                await updatePassword(newPassword, session.access_token);
                
                showSuccess('✅ Password updated successfully!');
                
                // Clear sensitive data
                tokenHash = null;
                window.location.hash = '';
                
                // Show additional instructions
                setTimeout(() => {
                    showInfo('You can now close this tab and sign in to the extension with your new password.');
                }, 1500);
                
            } catch (error) {
                console.error('[Reset] Error:', error);
                showError(error.message || 'Failed to update password. Please request a new reset link.');
                
                if (error.message.includes('expired') || error.message.includes('invalid')) {
                    document.getElementById('resetBtn').disabled = true;
                    showTokenStatus(false, 'This reset link has expired. Please request a new one.');
                }
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = originalText;
            }
        }
        
        function requestNewLink() {
            showInfo('Please open the Amazon Quick View Pro extension and click "Forgot Password?" to request a new link.');
            
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
            }
        }
        
        function openExtension() {
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
                showInfo('Extension opened! Look for the Amazon Quick View Pro icon in your browser toolbar.');
            } else {
                showInfo('Click the Amazon Quick View Pro icon in your browser toolbar to open the extension.');
            }
        }
        
        async function init() {
            console.log('[Reset] Initializing...');
            console.log('[Reset] Current URL:', window.location.href);
            
            const hasToken = extractTokenHash();
            
            if (!hasToken) {
                showTokenStatus(false, 'No reset token found. Please request a new reset link.');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            // Show loading state
            showTokenStatus(true, 'Verifying reset link...');
            
            // Validate the token and get session
            const session = await validateAndGetSession();
            
            if (session && session.user && session.user.email) {
                showTokenStatus(true, 'Reset link verified', session.user.email);
                document.getElementById('resetBtn').disabled = false;
            } else {
                showTokenStatus(false, 'Reset link is invalid or has expired. Please request a new one.');
                document.getElementById('resetBtn').disabled = true;
            }
        }
        
        // Event listeners
        document.getElementById('resetBtn').addEventListener('click', handleReset);
        document.getElementById('newPassword').addEventListener('input', updateRequirements);
        document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
        document.getElementById('requestNewLink').addEventListener('click', (e) => {
            e.preventDefault();
            requestNewLink();
        });
        document.getElementById('backToExtension').addEventListener('click', (e) => {
            e.preventDefault();
            openExtension();
        });
        
        // Enter key support
        document.getElementById('newPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                handleReset();
            }
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                handleReset();
            }
        });
        
        // Start
        init();
    </script>
</body>
</html>
