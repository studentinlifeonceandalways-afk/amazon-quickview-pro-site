<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header h1 { color: white; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .reset-header p { color: rgba(255,255,255,0.9); font-size: 14px; }
        .reset-body { padding: 32px 28px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .input-group input {
            width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; transition: all 0.2s ease;
        }
        .input-group input:focus { outline: none; border-color: #ff9900; box-shadow: 0 0 0 3px rgba(255,153,0,0.1); }
        
        .error-message {
            background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #dc2626;
        }
        .success-message {
            background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #16a34a;
        }
        .info-message {
            background: #e0f2fe; color: #0284c7; padding: 12px; border-radius: 12px;
            font-size: 13px; margin-bottom: 20px; display: none; border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white; border: none; border-radius: 12px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(255,153,0,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .loading-spinner {
            display: inline-block; width: 16px; height: 16px; border: 2px solid white;
            border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-links { text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eef2f6; }
        .footer-links a { color: #ff9900; text-decoration: none; font-size: 13px; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
        
        .step-container {
            transition: all 0.3s ease;
        }
        
        .step-hidden {
            display: none;
        }
        
        .code-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .code-input-group input {
            flex: 2;
        }
        
        .code-input-group button {
            flex: 1;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset code</p>
        </div>
        
        <div class="reset-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <!-- Step 1: Email Entry -->
            <div id="step1" class="step-container">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" placeholder="you@example.com">
                </div>
                <button id="sendCodeBtn" class="btn-primary">Send Reset Code</button>
                <p style="font-size: 11px; color: #64748b; text-align: center; margin-top: 12px;">
                    We'll send a 6-digit code to your email
                </p>
            </div>
            
            <!-- Step 2: Code and New Password -->
            <div id="step2" class="step-container step-hidden">
                <div class="input-group">
                    <label>Verification Code</label>
                    <div class="code-input-group">
                        <input type="text" id="verificationCode" placeholder="Enter 6-digit code" maxlength="6">
                        <button id="resendCodeBtn" class="btn-primary" style="padding: 12px; font-size: 12px;">Resend</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
                </div>
                <div class="input-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
                </div>
                <ul class="requirement-list">
                    <li id="req-length">At least 6 characters</li>
                    <li id="req-match">Passwords match</li>
                </ul>
                <button id="resetBtn" class="btn-primary" disabled>Reset Password</button>
            </div>
            
            <div class="footer-links">
                <a href="#" id="backToExtension">← Open Extension</a>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let currentEmail = '';
        let countdownInterval = null;
        
        // Send reset code
        async function sendResetCode() {
            const email = document.getElementById('resetEmail').value.trim();
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            const sendBtn = document.getElementById('sendCodeBtn');
            const originalText = sendBtn.innerHTML;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading-spinner"></span> Sending...';
            
            try {
                // Request password reset (this sends email with magic link)
                // But we'll also capture the OTP for code-based reset
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error_description || 'Failed to send reset code');
                }
                
                currentEmail = email;
                showSuccess(`Reset code sent to ${email}. Check your inbox.`);
                
                // Move to step 2
                document.getElementById('step1').classList.add('step-hidden');
                document.getElementById('step2').classList.remove('step-hidden');
                
                // Start countdown for resend button
                startResendCountdown();
                
            } catch (error) {
                console.error('[Reset] Send code error:', error);
                showError(error.message || 'Failed to send reset code');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalText;
            }
        }
        
        // Verify OTP and update password
        async function verifyAndUpdatePassword() {
            const code = document.getElementById('verificationCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!code || code.length < 6) {
                showError('Please enter the 6-digit verification code');
                return;
            }
            
            if (newPassword.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            const originalText = resetBtn.innerHTML;
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Verifying and updating...';
            
            try {
                // Step 1: Verify the OTP code
                const verifyResponse = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'recovery',
                        email: currentEmail,
                        token: code
                    })
                });
                
                console.log('[Reset] Verify response:', verifyResponse.status);
                
                if (!verifyResponse.ok) {
                    const error = await verifyResponse.json();
                    console.error('[Reset] Verify error:', error);
                    throw new Error(error.msg || 'Invalid or expired verification code');
                }
                
                const session = await verifyResponse.json();
                console.log('[Reset] Verification successful');
                
                // Step 2: Update password using the session token
                const updateResponse = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                console.log('[Reset] Update response:', updateResponse.status);
                
                if (!updateResponse.ok) {
                    const error = await updateResponse.json();
                    throw new Error(error.message || 'Failed to update password');
                }
                
                showSuccess('✅ Password reset successfully!');
                
                // Clear form
                document.getElementById('verificationCode').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Show success and redirect instruction
                setTimeout(() => {
                    showInfo('You can now close this tab and sign in to the extension with your new password.');
                }, 1500);
                
                // Reset UI after 3 seconds
                setTimeout(() => {
                    document.getElementById('step2').classList.add('step-hidden');
                    document.getElementById('step1').classList.remove('step-hidden');
                    document.getElementById('resetEmail').value = '';
                }, 4000);
                
            } catch (error) {
                console.error('[Reset] Error:', error);
                showError(error.message || 'Failed to reset password');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = originalText;
            }
        }
        
        // Resend reset code
        async function resendCode() {
            if (!currentEmail) return;
            
            const resendBtn = document.getElementById('resendCodeBtn');
            const originalText = resendBtn.innerHTML;
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<span class="loading-spinner"></span>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: currentEmail })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to resend code');
                }
                
                showSuccess(`New reset code sent to ${currentEmail}`);
                startResendCountdown();
                
            } catch (error) {
                showError('Failed to resend code. Please try again.');
            } finally {
                resendBtn.disabled = false;
                resendBtn.innerHTML = originalText;
            }
        }
        
        function startResendCountdown() {
            const resendBtn = document.getElementById('resendCodeBtn');
            let seconds = 60;
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            resendBtn.disabled = true;
            resendBtn.innerHTML = `Resend (${seconds}s)`;
            
            countdownInterval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend';
                } else {
                    resendBtn.innerHTML = `Resend (${seconds}s)`;
                }
            }, 1000);
        }
        
        // Validate password requirements in real-time
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            const lengthValid = password.length >= 6;
            const matchValid = password === confirm && password !== '';
            const isValid = lengthValid && matchValid;
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (lengthValid) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.classList.add('invalid');
            }
            
            if (matchValid) {
                matchReq.classList.add('valid');
                matchReq.classList.remove('invalid');
            } else {
                matchReq.classList.remove('valid');
                matchReq.classList.add('invalid');
            }
            
            const code = document.getElementById('verificationCode').value.trim();
            resetBtn.disabled = !(isValid && code.length >= 6);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 4000);
        }
        
        function openExtension() {
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
                showInfo('Extension opened! Look for the Amazon Quick View Pro icon.');
            } else {
                showInfo('Click the Amazon Quick View Pro icon in your browser toolbar.');
            }
        }
        
        // Event listeners
        document.getElementById('sendCodeBtn').addEventListener('click', sendResetCode);
        document.getElementById('resendCodeBtn').addEventListener('click', resendCode);
        document.getElementById('resetBtn').addEventListener('click', verifyAndUpdatePassword);
        document.getElementById('backToExtension').addEventListener('click', (e) => {
            e.preventDefault();
            openExtension();
        });
        
        document.getElementById('verificationCode').addEventListener('input', updateRequirements);
        document.getElementById('newPassword').addEventListener('input', updateRequirements);
        document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
        
        // Enter key support
        document.getElementById('resetEmail').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendResetCode();
        });
        document.getElementById('verificationCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                verifyAndUpdatePassword();
            }
        });
        
        // Check if there's a token in URL (from email link) and extract email if possible
        function checkUrlForToken() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const tokenHash = params.get('token_hash');
            const type = params.get('type');
            
            if (tokenHash && type === 'recovery') {
                // Show info that they should use email instead
                showInfo('For security, please enter your email below to receive a reset code.');
            }
        }
        
        checkUrlForToken();
    </script>
</body>
</html>
