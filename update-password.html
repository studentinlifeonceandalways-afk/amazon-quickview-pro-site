<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4fa 0%, #e9eef5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Subtle background pattern */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 40%, rgba(255, 153, 0, 0.03) 2px, transparent 2px),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 12px);
            background-size: 32px 32px, 20px 20px;
            pointer-events: none;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(0px);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(255, 153, 0, 0.2);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b, #3b4b66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 4px;
        }

        .logo p {
            font-size: 12px;
            color: #5b6e8c;
            font-weight: 500;
        }

        /* Form elements */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.12);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 10px;
        }

        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 4px;
            width: 100%;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
            border-radius: 2px;
        }

        .strength-text {
            color: #64748b;
            margin-top: 4px;
            display: inline-block;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 4px rgba(255, 153, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        /* Messages */
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #dc2626;
        }

        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #16a34a;
        }

        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid #0284c7;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eef2f6;
        }

        .divider::before {
            margin-right: 12px;
        }

        .divider::after {
            margin-left: 12px;
        }

        /* Token info */
        .token-info {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #64748b;
            word-break: break-all;
        }

        /* Manual token input */
        .manual-token-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }

        .manual-token-section .input-group {
            margin-bottom: 12px;
        }

        .toggle-manual {
            background: none;
            border: none;
            color: #ff9900;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Amazon Quick View Pro</h1>
            <p>Reset your password</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="infoMessage" class="info-message"></div>

        <!-- Token Info (shows if token was extracted) -->
        <div id="tokenInfo" class="token-info" style="display: none;"></div>

        <!-- Main Form -->
        <div id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Enter a password</span>
                </div>
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>
            <button id="updatePasswordBtn" class="btn-primary">Update Password</button>
        </div>

        <!-- Manual Token Input (expandable) -->
        <div class="manual-token-section">
            <button id="toggleManualToken" class="toggle-manual">+ Enter reset token manually</button>
            <div id="manualTokenInput" style="display: none; margin-top: 12px;">
                <div class="input-group">
                    <label>Reset Token / Access Token</label>
                    <input type="text" id="manualAccessToken" placeholder="Paste the token from the URL">
                </div>
                <div class="input-group">
                    <label>Refresh Token (optional)</label>
                    <input type="text" id="manualRefreshToken" placeholder="Paste refresh token if available">
                </div>
                <button id="useManualTokenBtn" class="btn-secondary">Use Token</button>
                <p style="font-size: 10px; color: #94a3b8; margin-top: 8px;">
                    If the automatic link didn't work, you can paste the access token from the URL manually.
                </p>
            </div>
        </div>

        <div class="divider">or</div>

        <button id="backToExtensionBtn" class="btn-secondary">← Back to Extension</button>
    </div>

    <script>
        // Supabase configuration (same as extension)
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';

        // DOM Elements
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const updateBtn = document.getElementById('updatePasswordBtn');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const infoDiv = document.getElementById('infoMessage');
        const tokenInfoDiv = document.getElementById('tokenInfo');
        const toggleManualBtn = document.getElementById('toggleManualToken');
        const manualTokenDiv = document.getElementById('manualTokenInput');
        const manualAccessToken = document.getElementById('manualAccessToken');
        const manualRefreshToken = document.getElementById('manualRefreshToken');
        const useManualTokenBtn = document.getElementById('useManualTokenBtn');
        const backToExtensionBtn = document.getElementById('backToExtensionBtn');

        // State
        let extractedAccessToken = null;
        let extractedRefreshToken = null;
        let extractedUserEmail = null;
        let usingManualToken = false;

        // ============ HELPER FUNCTIONS ============

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }

        function showInfo(message) {
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 3000);
        }

        function hideAllMessages() {
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            infoDiv.style.display = 'none';
        }

        // Password strength checker
        function checkPasswordStrength(password) {
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            if (!password) {
                strengthFill.style.width = '0%';
                strengthFill.style.background = '#e2e8f0';
                strengthText.textContent = 'Enter a password';
                strengthText.style.color = '#64748b';
                return 0;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const percentage = (strength / 5) * 100;
            strengthFill.style.width = `${percentage}%`;
            
            if (strength <= 1) {
                strengthFill.style.background = '#ef4444';
                strengthText.textContent = 'Weak';
                strengthText.style.color = '#ef4444';
            } else if (strength <= 3) {
                strengthFill.style.background = '#f59e0b';
                strengthText.textContent = 'Medium';
                strengthText.style.color = '#f59e0b';
            } else {
                strengthFill.style.background = '#10b981';
                strengthText.textContent = 'Strong';
                strengthText.style.color = '#10b981';
            }
            
            return strength;
        }

        // Update password using access token
        async function updatePassword(accessToken, newPassword) {
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    let errorMsg = data.message || data.error_description || 'Failed to update password';
                    if (response.status === 401) {
                        errorMsg = 'Your reset link has expired or is invalid. Please request a new password reset.';
                    }
                    throw new Error(errorMsg);
                }
                
                console.log('[Password Reset] Successfully updated password');
                return { success: true, user: data };
                
            } catch (error) {
                console.error('[Password Reset] Update error:', error);
                return { success: false, error: error.message };
            }
        }

        // Extract token from URL hash fragment (Supabase magic link format)
        function extractTokenFromUrl() {
            const hash = window.location.hash;
            console.log('[Password Reset] URL hash:', hash);
            
            if (!hash || hash.length < 2) {
                console.log('[Password Reset] No hash fragment found');
                return null;
            }
            
            // Remove leading #
            const hashContent = hash.substring(1);
            
            // Parse as query string
            const params = new URLSearchParams(hashContent);
            
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const tokenType = params.get('token_type');
            const expiresIn = params.get('expires_in');
            const type = params.get('type');
            
            console.log('[Password Reset] Extracted from hash:', {
                hasAccessToken: !!accessToken,
                hasRefreshToken: !!refreshToken,
                tokenType,
                type
            });
            
            if (accessToken) {
                return { accessToken, refreshToken, type };
            }
            
            // Also check if token is in query params (alternative format)
            const urlParams = new URLSearchParams(window.location.search);
            const queryAccessToken = urlParams.get('access_token');
            if (queryAccessToken) {
                return { 
                    accessToken: queryAccessToken, 
                    refreshToken: urlParams.get('refresh_token'),
                    type: urlParams.get('type')
                };
            }
            
            return null;
        }

        // Display token info for debugging
        function displayTokenInfo(tokenData) {
            if (!tokenData || !tokenData.accessToken) {
                tokenInfoDiv.style.display = 'none';
                return;
            }
            
            const tokenPreview = tokenData.accessToken.substring(0, 20) + '...' + tokenData.accessToken.substring(tokenData.accessToken.length - 10);
            tokenInfoDiv.innerHTML = `
                <strong>🔐 Reset token detected</strong><br>
                Token: ${tokenPreview}<br>
                Type: ${tokenData.type || 'recovery'}<br>
                ${tokenData.refreshToken ? 'Refresh token: ✓' : ''}
            `;
            tokenInfoDiv.style.display = 'block';
        }

        // Main reset flow
        async function performPasswordReset(accessToken, newPassword, confirmPassword) {
            hideAllMessages();
            
            if (!newPassword || newPassword.length < 6) {
                showError('Password must be at least 6 characters');
                return false;
            }
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return false;
            }
            
            if (!accessToken) {
                showError('No reset token found. The link may be invalid. Try requesting a new password reset.');
                return false;
            }
            
            updateBtn.disabled = true;
            updateBtn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                const result = await updatePassword(accessToken, newPassword);
                
                if (result.success) {
                    showSuccess('✅ Password updated successfully! You can now sign in with your new password.');
                    
                    // Clear form
                    newPasswordInput.value = '';
                    confirmPasswordInput.value = '';
                    
                    // Show additional info
                    setTimeout(() => {
                        showInfo('Redirecting to extension login page in 3 seconds...');
                        setTimeout(() => {
                            // Try to open extension side panel
                            if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
                                chrome.runtime.sendMessage({ action: 'openSidePanel' }).catch(() => {});
                            }
                            // Redirect to extension login page if available
                            window.location.href = 'chrome-extension://' + (window.chrome?.runtime?.id || '') + '/login.html';
                        }, 3000);
                    }, 500);
                    
                    return true;
                } else {
                    showError(result.error || 'Failed to update password. Please request a new reset link.');
                    return false;
                }
            } catch (error) {
                showError(error.message || 'An error occurred. Please try again.');
                return false;
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerHTML = 'Update Password';
            }
        }

        // Initialize from URL token
        async function initializeFromUrl() {
            const tokenData = extractTokenFromUrl();
            
            if (tokenData && tokenData.accessToken) {
                extractedAccessToken = tokenData.accessToken;
                extractedRefreshToken = tokenData.refreshToken;
                displayTokenInfo(tokenData);
                showInfo('✓ Reset token detected. Enter your new password below.');
                
                // Try to get user info from token (optional)
                try {
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${extractedAccessToken}`
                        }
                    });
                    const userData = await response.json();
                    if (userData.email) {
                        extractedUserEmail = userData.email;
                        showInfo(`Reset in progress for: ${userData.email}`);
                    }
                } catch (e) {
                    console.log('[Password Reset] Could not fetch user info:', e);
                }
            } else {
                // No token found - show manual input option more prominently
                showInfo('No reset token found in URL. If you have a token from the email, paste it manually below.');
                manualTokenDiv.style.display = 'block';
                toggleManualBtn.textContent = '− Hide manual input';
            }
        }

        // ============ EVENT LISTENERS ============

        // Password strength checker
        newPasswordInput.addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
            
            // Auto-check confirm password match
            if (confirmPasswordInput.value && e.target.value !== confirmPasswordInput.value) {
                confirmPasswordInput.style.borderColor = '#ef4444';
            } else if (confirmPasswordInput.value) {
                confirmPasswordInput.style.borderColor = '#10b981';
            } else {
                confirmPasswordInput.style.borderColor = '#e2e8f0';
            }
        });

        confirmPasswordInput.addEventListener('input', (e) => {
            if (newPasswordInput.value !== e.target.value) {
                e.target.style.borderColor = '#ef4444';
            } else {
                e.target.style.borderColor = '#10b981';
            }
        });

        // Update password button
        updateBtn.addEventListener('click', async () => {
            const token = usingManualToken ? manualAccessToken.value.trim() : extractedAccessToken;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            await performPasswordReset(token, newPassword, confirmPassword);
        });

        // Enter key support
        newPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') updateBtn.click();
        });
        confirmPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') updateBtn.click();
        });

        // Toggle manual token input
        toggleManualBtn.addEventListener('click', () => {
            if (manualTokenDiv.style.display === 'none') {
                manualTokenDiv.style.display = 'block';
                toggleManualBtn.textContent = '− Hide manual input';
            } else {
                manualTokenDiv.style.display = 'none';
                toggleManualBtn.textContent = '+ Enter reset token manually';
            }
        });

        // Use manual token
        useManualTokenBtn.addEventListener('click', () => {
            const token = manualAccessToken.value.trim();
            if (!token) {
                showError('Please enter a valid reset token');
                return;
            }
            
            usingManualToken = true;
            extractedAccessToken = token;
            extractedRefreshToken = manualRefreshToken.value.trim() || null;
            
            displayTokenInfo({ accessToken: token, refreshToken: extractedRefreshToken });
            showSuccess('✓ Manual token accepted. You can now reset your password.');
            
            // Hide manual section after use
            manualTokenDiv.style.display = 'none';
            toggleManualBtn.style.display = 'none';
        });

        // Back to extension
        backToExtensionBtn.addEventListener('click', () => {
            if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' }).catch(() => {});
            }
            window.close();
        });

        // Also listen for messages from extension
        if (window.chrome && chrome.runtime) {
            chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
                if (request.action === 'setResetToken') {
                    if (request.token) {
                        extractedAccessToken = request.token;
                        displayTokenInfo({ accessToken: request.token });
                        showInfo('Token received from extension. Enter your new password.');
                        sendResponse({ success: true });
                    }
                }
                return true;
            });
        }

        // Initialize
        initializeFromUrl();

        // Clean URL hash for security (optional)
        if (window.location.hash && extractedAccessToken) {
            // You can choose to clear the hash after extraction
            // history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    </script>
</body>
</html>
