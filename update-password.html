<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            margin-bottom: 24px;
        }
        
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .logo-icon svg {
            width: 32px;
            height: 32px;
        }
        
        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        
        .message.info {
            background: #e0f2fe;
            color: #0369a1;
            display: block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ff9900;
            text-decoration: none;
            font-size: 13px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .requirements {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <div class="subtitle">Amazon Quick View Pro</div>
        </div>
        
        <div id="message" class="message"></div>
        
        <div id="step1">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password">
            </div>
            <div class="requirements">Password must be at least 6 characters</div>
            <button id="resetBtn" class="btn-primary">Update Password</button>
        </div>
        
        <a href="#" id="backLink" class="back-link">← Back to Extension</a>
    </div>

    <script>
        // Supabase configuration - same as your extension
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let accessToken = null;
        let refreshToken = null;
        
        // Parse URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.hash.substring(1));
            return {
                access_token: params.get('access_token'),
                refresh_token: params.get('refresh_token'),
                type: params.get('type')
            };
        }
        
        // Show message
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            
            // Auto-hide success after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    msgDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        // Update password using Supabase API
        async function updatePassword(newPassword) {
            if (!accessToken) {
                showMessage('Invalid reset link. Please request a new password reset.', 'error');
                return false;
            }
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || data.error_description || 'Failed to update password');
                }
                
                console.log('Password updated successfully');
                return true;
                
            } catch (error) {
                console.error('Update password error:', error);
                showMessage(error.message || 'Failed to update password. Please try again.', 'error');
                return false;
            }
        }
        
        // Initialize - check for valid access token in URL
        function init() {
            const params = getUrlParams();
            
            console.log('URL params:', params);
            
            if (params.access_token && params.type === 'recovery') {
                accessToken = params.access_token;
                refreshToken = params.refresh_token;
                showMessage('Please enter your new password below.', 'info');
            } else {
                // Check if it's an old-style hash or error
                if (window.location.hash && window.location.hash.includes('error')) {
                    showMessage('This password reset link has expired or is invalid. Please request a new one.', 'error');
                } else {
                    showMessage('Invalid or missing reset token. Please request a new password reset from the extension.', 'error');
                }
                document.getElementById('step1').style.opacity = '0.5';
                document.querySelectorAll('input, button').forEach(el => el.disabled = true);
            }
        }
        
        // Handle reset button click
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            
            // Validate
            if (!newPassword || newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Disable button during processing
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Updating...';
            
            const success = await updatePassword(newPassword);
            
            if (success) {
                showMessage('✅ Password updated successfully! You can now sign in with your new password.', 'success');
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Optionally redirect to extension after 3 seconds
                setTimeout(() => {
                    // Try to open the extension
                    if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                        chrome.runtime.sendMessage({ action: 'openSidePanel' });
                    }
                    window.close();
                }, 3000);
            }
            
            btn.disabled = false;
            btn.innerHTML = 'Update Password';
        });
        
        // Enter key support
        document.getElementById('newPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('resetBtn').click();
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('resetBtn').click();
        });
        
        // Back link
        document.getElementById('backLink').addEventListener('click', (e) => {
            e.preventDefault();
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
            }
            window.close();
        });
        
        // Start
        init();
    </script>
</body>
</html>
