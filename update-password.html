<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .reset-header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        
        .reset-body {
            padding: 32px 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #dc2626;
        }
        
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #16a34a;
        }
        
        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        
        .footer-links a {
            color: #ff9900;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .code-input {
            font-family: monospace;
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
        }
        
        .timer-text {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }
        
        .requirement-list {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            padding-left: 16px;
            list-style: none;
        }
        
        .requirement-list li {
            margin-bottom: 4px;
            padding-left: 20px;
            position: relative;
        }
        
        .requirement-list li.valid {
            color: #10b981;
        }
        
        .requirement-list li.valid::before {
            content: '✓';
            position: absolute;
            left: 0;
        }
        
        .requirement-list li.invalid::before {
            content: '○';
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Secure your account</p>
        </div>
        
        <div class="reset-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <!-- STEP 1: Enter Email -->
            <div id="step1" class="step active">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                </div>
                <button id="sendCodeBtn" class="btn-primary">Send Reset Code</button>
                <div class="footer-links">
                    <a href="#" id="backToExtension">← Open Extension</a>
                </div>
            </div>
            
            <!-- STEP 2: Enter Code and New Password -->
            <div id="step2" class="step">
                <div class="input-group">
                    <label>Verification Code</label>
                    <input type="text" id="resetCode" class="code-input" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off">
                    <div id="timerText" class="timer-text"></div>
                </div>
                
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
                </div>
                
                <div class="input-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
                </div>
                
                <ul class="requirement-list">
                    <li id="req-length">At least 6 characters</li>
                    <li id="req-match">Passwords match</li>
                </ul>
                
                <button id="resetBtn" class="btn-primary" disabled>Update Password</button>
                <div class="footer-links">
                    <a href="#" id="backToStep1">← Back to Email</a>
                    <span style="margin: 0 8px;">|</span>
                    <a href="#" id="resendCode">Resend Code</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let resetEmail = '';
        let resendTimer = null;
        let timeLeft = 0;
        
        // Helper functions
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 5000);
        }
        
        function startResendTimer(seconds = 60) {
            timeLeft = seconds;
            const timerText = document.getElementById('timerText');
            const resendLink = document.getElementById('resendCode');
            
            function updateTimer() {
                if (timeLeft <= 0) {
                    if (resendLink) {
                        resendLink.style.opacity = '1';
                        resendLink.style.pointerEvents = 'auto';
                    }
                    if (timerText) timerText.textContent = '';
                    clearInterval(resendTimer);
                    resendTimer = null;
                } else {
                    if (resendLink) {
                        resendLink.style.opacity = '0.5';
                        resendLink.style.pointerEvents = 'none';
                    }
                    if (timerText) timerText.textContent = `Resend code in ${timeLeft} seconds`;
                    timeLeft--;
                }
            }
            
            updateTimer();
            if (resendTimer) clearInterval(resendTimer);
            resendTimer = setInterval(updateTimer, 1000);
        }
        
        function validatePassword(password, confirm) {
            const lengthValid = password.length >= 6;
            const matchValid = password === confirm && password !== '';
            const isValid = lengthValid && matchValid;
            
            return { isValid, lengthValid, matchValid };
        }
        
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            const { isValid, lengthValid, matchValid } = validatePassword(password, confirm);
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (lengthValid) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.classList.add('invalid');
            }
            
            if (matchValid) {
                matchReq.classList.add('valid');
                matchReq.classList.remove('invalid');
            } else {
                matchReq.classList.remove('valid');
                matchReq.classList.add('invalid');
            }
            
            resetBtn.disabled = !isValid;
        }
        
        // STEP 1: Send reset code
        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Sending code...';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error_description || 'Failed to send reset code');
                }
                
                resetEmail = email;
                showSuccess(`Verification code sent to ${email}`);
                
                // Move to step 2
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
                // Start timer for resend
                startResendTimer(60);
                
                // Focus on code input
                document.getElementById('resetCode').focus();
                
            } catch (error) {
                console.error('Send code error:', error);
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Code';
            }
        });
        
        // Resend code
        document.getElementById('resendCode').addEventListener('click', async (e) => {
            e.preventDefault();
            
            if (timeLeft > 0) {
                showError(`Please wait ${timeLeft} seconds before requesting another code`);
                return;
            }
            
            const btn = document.getElementById('resendCode');
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: resetEmail })
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error_description || 'Failed to resend code');
                }
                
                showSuccess(`New verification code sent to ${resetEmail}`);
                startResendTimer(60);
                
            } catch (error) {
                showError(error.message);
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        });
        
        // STEP 2: Verify OTP and update password
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!code || code.length < 6) {
                showError('Please enter the 6-digit verification code');
                return;
            }
            
            const { isValid, lengthValid, matchValid } = validatePassword(newPassword, confirmPassword);
            
            if (!isValid) {
                if (!lengthValid) showError('Password must be at least 6 characters');
                else if (!matchValid) showError('Passwords do not match');
                return;
            }
            
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                // Step 2a: Verify OTP
                const verifyResponse = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: resetEmail,
                        token: code,
                        type: 'recovery'
                    })
                });
                
                if (!verifyResponse.ok) {
                    const error = await verifyResponse.json();
                    throw new Error(error.message || 'Invalid or expired verification code');
                }
                
                const session = await verifyResponse.json();
                
                // Step 2b: Update password
                const updateResponse = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                if (!updateResponse.ok) {
                    const error = await updateResponse.json();
                    throw new Error(error.message || 'Password update failed');
                }
                
                showSuccess('✅ Password updated successfully!');
                
                // Clear form
                document.getElementById('resetCode').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Redirect to extension after 2 seconds
                setTimeout(() => {
                    if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                        chrome.runtime.sendMessage({ action: 'openSidePanel' });
                    }
                    showInfo('You can now sign in to the extension with your new password.');
                }, 2000);
                
            } catch (error) {
                console.error('Reset error:', error);
                showError(error.message);
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
            }
        });
        
        // Back to step 1
        document.getElementById('backToStep1').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('resetCode').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            if (resendTimer) clearInterval(resendTimer);
        });
        
        // Open extension
        document.getElementById('backToExtension').addEventListener('click', (e) => {
            e.preventDefault();
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
            } else {
                showInfo('Click the Amazon Quick View Pro icon in your browser toolbar.');
            }
        });
        
        // Real-time password validation
        document.getElementById('newPassword').addEventListener('input', updateRequirements);
        document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
        
        // Enter key support
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendCodeBtn').click();
            }
        });
        
        document.getElementById('resetCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                document.getElementById('resetBtn').click();
            }
        });
        
        // Auto-format code input (numbers only)
        document.getElementById('resetCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
    </script>
</body>
</html>
