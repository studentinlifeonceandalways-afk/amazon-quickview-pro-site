<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4fa 0%, #e9eef5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .logo p {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .message {
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-left: 3px solid #dc2626;
        }

        .message.success {
            background: #dcfce7;
            color: #16a34a;
            border-left: 3px solid #16a34a;
        }

        .message.info {
            background: #e0f2fe;
            color: #0284c7;
            border-left: 3px solid #0284c7;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            font-size: 11px;
            color: #94a3b8;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .note {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Amazon Quick View Pro</p>
        </div>

        <div id="message" class="message"></div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="your@email.com">
        </div>

        <button id="resetBtn" class="btn-primary">Send Reset Link</button>

        <div class="divider">or</div>

        <button id="backBtn" class="btn-secondary">← Back to Extension</button>

        <div class="note">
            We'll send you a link to reset your password. Click the link in the email to choose a new password.
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';

        // IMPORTANT: Replace with your actual hosted URL
        // This is where users will be redirected after clicking the email link
        const REDIRECT_URL = 'https://yourdomain.com/update-password.html';
        
        // For testing locally, you can use:
        // const REDIRECT_URL = 'http://localhost:5500/update-password.html';

        // DOM elements
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const backBtn = document.getElementById('backBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        async function sendResetEmail() {
            const email = emailInput.value.trim();

            // Validation
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Sending...';

            try {
                // Send password reset email with redirect URL
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: email,
                        redirect_to: REDIRECT_URL
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Handle specific error cases
                    if (data.error_description) {
                        if (data.error_description.includes('User not found')) {
                            throw new Error('No account found with this email address');
                        }
                        throw new Error(data.error_description);
                    }
                    throw new Error(data.message || 'Failed to send reset email');
                }

                // Success - email sent
                showMessage(`✓ Password reset link sent to ${email}. Check your inbox (and spam folder).`, 'success');
                
                // Clear the email input
                emailInput.value = '';

                // Optional: Show additional instructions
                setTimeout(() => {
                    showMessage('Click the link in the email to set a new password. The link expires in 24 hours.', 'info');
                }, 2000);

            } catch (error) {
                console.error('[Reset] Error:', error);
                
                if (error.message.includes('rate limit')) {
                    showMessage('Too many requests. Please wait a few minutes before trying again.', 'error');
                } else {
                    showMessage(error.message || 'Failed to send reset email. Please try again.', 'error');
                }
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Send Reset Link';
            }
        }

        // Back to extension
        backBtn.addEventListener('click', () => {
            if (window.chrome && chrome.runtime) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' }).catch(() => {});
            }
            window.close();
        });

        // Enter key support
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendResetEmail();
        });

        resetBtn.addEventListener('click', sendResetEmail);
    </script>
</body>
</html>
