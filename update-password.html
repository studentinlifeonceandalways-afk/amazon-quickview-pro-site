<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header .logo-icon svg {
            width: 32px;
            height: 32px;
        }
        
        .reset-header h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .reset-header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        
        .reset-body {
            padding: 32px 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .input-group input.error {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #dc2626;
        }
        
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #16a34a;
        }
        
        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        
        .footer-links a {
            color: #ff9900;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .password-strength {
            margin-top: 6px;
            font-size: 11px;
        }
        
        .strength-weak { color: #ef4444; }
        .strength-medium { color: #f59e0b; }
        .strength-strong { color: #10b981; }
        
        .requirement-list {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            padding-left: 16px;
        }
        
        .requirement-list li {
            margin-bottom: 4px;
        }
        
        .requirement-list li.valid {
            color: #10b981;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your new password below</p>
        </div>
        
        <div class="reset-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
                <div class="password-strength" id="passwordStrength"></div>
            </div>
            
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            
            <ul class="requirement-list" id="requirements">
                <li id="req-length">✓ At least 6 characters</li>
                <li id="req-match">✓ Passwords match</li>
            </ul>
            
            <button id="resetBtn" class="btn-primary">Update Password</button>
            
            <div class="footer-links">
                <a href="#" id="backToLogin">← Back to Extension</a>
            </div>
        </div>
    </div>
    
    <script>
        // Supabase configuration - SAME as your extension
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let accessToken = null;
        let refreshToken = null;
        
        // Helper: Extract token from URL fragment
        function extractTokensFromUrl() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const token = params.get('access_token');
            const refresh = params.get('refresh_token');
            
            if (token) {
                accessToken = token;
                refreshToken = refresh;
                console.log('[Reset] Token extracted from URL');
                return true;
            }
            return false;
        }
        
        // Check if we have a valid token
        async function verifyToken() {
            if (!accessToken) return false;
            
            try {
                // Verify token is still valid
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                if (response.ok) {
                    const user = await response.json();
                    console.log('[Reset] Token verified for user:', user.email);
                    showInfo(`Resetting password for ${user.email}`);
                    return true;
                }
                
                // Token might be expired, try to refresh
                if (refreshToken) {
                    return await refreshSession();
                }
                
                return false;
            } catch (error) {
                console.error('[Reset] Token verification failed:', error);
                return false;
            }
        }
        
        // Refresh the session if possible
        async function refreshSession() {
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refresh_token: refreshToken })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    accessToken = data.access_token;
                    refreshToken = data.refresh_token;
                    console.log('[Reset] Session refreshed successfully');
                    return true;
                }
                
                return false;
            } catch (error) {
                console.error('[Reset] Session refresh failed:', error);
                return false;
            }
        }
        
        // Update password using Supabase API
        async function updatePassword(newPassword) {
            if (!accessToken) {
                throw new Error('No valid session found. Please request a new reset link.');
            }
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    let errorMsg = data.message || data.error_description || 'Password update failed';
                    
                    if (errorMsg.includes('JWT expired') || errorMsg.includes('token expired')) {
                        errorMsg = 'Reset link has expired. Please request a new password reset.';
                    }
                    
                    throw new Error(errorMsg);
                }
                
                console.log('[Reset] Password updated successfully');
                return true;
                
            } catch (error) {
                console.error('[Reset] Password update error:', error);
                throw error;
            }
        }
        
        // Password validation
        function validatePassword(password, confirm) {
            const errors = [];
            
            if (password.length < 6) {
                errors.push('Password must be at least 6 characters');
            }
            
            if (password !== confirm) {
                errors.push('Passwords do not match');
            }
            
            return {
                isValid: errors.length === 0,
                errors: errors,
                lengthValid: password.length >= 6,
                matchValid: password === confirm && password !== ''
            };
        }
        
        // Update UI requirements
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (password.length >= 6) {
                lengthReq.classList.add('valid');
                lengthReq.style.color = '#10b981';
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.style.color = '#64748b';
            }
            
            if (password === confirm && password !== '') {
                matchReq.classList.add('valid');
                matchReq.style.color = '#10b981';
            } else {
                matchReq.classList.remove('valid');
                matchReq.style.color = '#64748b';
            }
            
            // Password strength indicator
            const strengthEl = document.getElementById('passwordStrength');
            if (password.length === 0) {
                strengthEl.textContent = '';
            } else if (password.length < 6) {
                strengthEl.innerHTML = '<span class="strength-weak">⚠️ Too short (min 6 characters)</span>';
            } else if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                strengthEl.innerHTML = '<span class="strength-strong">✓ Strong password</span>';
            } else if (password.length >= 6) {
                strengthEl.innerHTML = '<span class="strength-medium">✓ Weak - add uppercase letters and numbers</span>';
            }
        }
        
        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        // Show info message
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 4000);
        }
        
        // Main reset function
        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const validation = validatePassword(newPassword, confirmPassword);
            
            if (!validation.isValid) {
                showError(validation.errors.join('. '));
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                await updatePassword(newPassword);
                
                showSuccess('Password updated successfully! Redirecting to extension...');
                
                // Clear the URL hash for security
                window.location.hash = '';
                
                // Redirect to extension after 2 seconds
                setTimeout(() => {
                    // Try to open the extension
                    if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                        // If this page is opened in extension context
                        chrome.runtime.sendMessage({ action: 'openSidePanel' });
                    }
                    // Show instructions to user
                    showInfo('You can now close this tab and sign in to the extension with your new password.');
                }, 2000);
                
            } catch (error) {
                console.error('[Reset] Error:', error);
                showError(error.message || 'Failed to update password. Please request a new reset link.');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Update Password';
            }
        }
        
        // Initialize the page
        async function init() {
            const hasToken = extractTokensFromUrl();
            
            if (!hasToken) {
                showError('Invalid reset link. Please request a new password reset from the extension.');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            const isValid = await verifyToken();
            
            if (!isValid) {
                showError('Reset link has expired or is invalid. Please request a new password reset.');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            console.log('[Reset] Ready to reset password');
        }
        
        // Event listeners
        document.getElementById('resetBtn').addEventListener('click', handleReset);
        document.getElementById('newPassword').addEventListener('input', updateRequirements);
        document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
        
        document.getElementById('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            // Try to open the extension
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
            }
            // Show instruction
            showInfo('Click the extension icon in your browser toolbar to open Amazon Quick View Pro');
        });
        
        // Enter key support
        document.getElementById('newPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleReset();
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleReset();
        });
        
        // Start
        init();
    </script>
</body>
</html>
