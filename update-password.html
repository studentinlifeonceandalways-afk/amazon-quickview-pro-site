<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .reset-header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        
        .reset-body {
            padding: 32px 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #dc2626;
        }
        
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #16a34a;
        }
        
        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        
        .footer-links a {
            color: #ff9900;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .requirement-list {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            padding-left: 16px;
            list-style: none;
        }
        
        .requirement-list li {
            margin-bottom: 4px;
            padding-left: 20px;
            position: relative;
        }
        
        .requirement-list li.valid {
            color: #10b981;
        }
        
        .requirement-list li.valid::before {
            content: '✓';
            position: absolute;
            left: 0;
        }
        
        .requirement-list li.invalid::before {
            content: '○';
            position: absolute;
            left: 0;
        }
        
        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1e40af;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .token-input {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>We'll send you a link to reset your password</p>
        </div>
        
        <div class="reset-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <!-- STEP 1: Enter Email -->
            <div id="step1" class="step active">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                </div>
                <button id="sendResetLinkBtn" class="btn-primary">Send Reset Link</button>
                <div class="footer-links">
                    <a href="#" id="backToExtension">← Open Extension</a>
                </div>
            </div>
            
            <!-- STEP 2: Set New Password (shown after clicking magic link) -->
            <div id="step2" class="step">
                <div class="info-box" id="step2Info">
                    🔐 Enter your new password below
                </div>
                
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
                </div>
                
                <div class="input-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
                </div>
                
                <ul class="requirement-list">
                    <li id="req-length">At least 6 characters</li>
                    <li id="req-match">Passwords match</li>
                </ul>
                
                <button id="updatePasswordBtn" class="btn-primary" disabled>Update Password</button>
                <div class="footer-links">
                    <a href="#" id="backToStep1">← Back to Email</a>
                    <span style="margin: 0 8px;">|</span>
                    <a href="#" id="resendLink">Resend Reset Link</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let currentAccessToken = null;
        let currentRefreshToken = null;
        
        // Helper functions
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 3000);
        }
        
        function validatePassword(password, confirm) {
            const lengthValid = password.length >= 6;
            const matchValid = password === confirm && password !== '';
            const isValid = lengthValid && matchValid;
            return { isValid, lengthValid, matchValid };
        }
        
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const updateBtn = document.getElementById('updatePasswordBtn');
            
            const { isValid, lengthValid, matchValid } = validatePassword(password, confirm);
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (lengthValid) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.classList.add('invalid');
            }
            
            if (matchValid) {
                matchReq.classList.add('valid');
                matchReq.classList.remove('invalid');
            } else {
                matchReq.classList.remove('valid');
                matchReq.classList.add('invalid');
            }
            
            updateBtn.disabled = !isValid;
        }
        
        // STEP 1: Send reset link (magic link)
        async function sendResetLink() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            const btn = document.getElementById('sendResetLinkBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Sending...';
            
            try {
                // IMPORTANT: Use your actual hosted page URL where this reset page will be
                // This page needs to be hosted online (not chrome-extension://)
                const redirectTo = 'https://amazonquickview.net/reset-password.html';
                
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email,
                        redirect_to: redirectTo
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error_description || data.message || 'Failed to send reset link');
                }
                
                showSuccess(`✅ Password reset link sent to ${email}\n\nCheck your email and click the link to reset your password. The link expires in 24 hours.`);
                
                // Clear email input
                document.getElementById('email').value = '';
                
            } catch (error) {
                console.error('Send reset link error:', error);
                let errorMessage = error.message;
                if (error.message.includes('User not found')) {
                    errorMessage = 'No account found with this email address.';
                }
                showError(errorMessage);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        }
        
        // STEP 2: Update password using the token from URL
        async function updatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const { isValid, lengthValid, matchValid } = validatePassword(newPassword, confirmPassword);
            
            if (!isValid) {
                if (!lengthValid) showError('Password must be at least 6 characters');
                else if (!matchValid) showError('Passwords do not match');
                return;
            }
            
            if (!currentAccessToken) {
                showError('No valid reset token found. Please request a new reset link.');
                return;
            }
            
            const btn = document.getElementById('updatePasswordBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                // Update password using the access token from the magic link
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Update error:', errorData);
                    
                    if (response.status === 401) {
                        throw new Error('Reset link has expired. Please request a new one.');
                    }
                    throw new Error(errorData.message || 'Password update failed');
                }
                
                showSuccess('✅ Password updated successfully!');
                
                // Clear sensitive data
                currentAccessToken = null;
                currentRefreshToken = null;
                
                // Clear the URL hash/query parameters
                window.history.replaceState({}, document.title, window.location.pathname);
                
                // Redirect to extension after 2 seconds
                setTimeout(() => {
                    if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                        chrome.runtime.sendMessage({ action: 'openSidePanel' });
                        showInfo('Opening extension...');
                    } else {
                        showInfo('You can now close this tab and sign in to the extension with your new password.');
                    }
                }, 2000);
                
            } catch (error) {
                console.error('Update password error:', error);
                showError(error.message);
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
            }
        }
        
        // Parse token from URL (magic link)
        function parseTokenFromURL() {
            // Supabase appends access_token in the URL fragment after redirect
            // Format: https://yourdomain.com/reset-password#access_token=xxx&refresh_token=xxx&type=recovery
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const type = params.get('type');
            
            console.log('[Reset] URL parse:', { hasToken: !!accessToken, type, hash: hash.substring(0, 50) + '...' });
            
            if (accessToken && type === 'recovery') {
                currentAccessToken = accessToken;
                currentRefreshToken = refreshToken;
                
                // Store temporarily for update step
                sessionStorage.setItem('resetAccessToken', accessToken);
                sessionStorage.setItem('resetRefreshToken', refreshToken || '');
                
                return true;
            }
            
            // Also check session storage (if page reloaded)
            const storedToken = sessionStorage.getItem('resetAccessToken');
            if (storedToken) {
                currentAccessToken = storedToken;
                currentRefreshToken = sessionStorage.getItem('resetRefreshToken') || '';
                return true;
            }
            
            return false;
        }
        
        // Show step 2 (password reset form) when token is present
        function showStep2() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            // Update info message
            const infoBox = document.getElementById('step2Info');
            infoBox.innerHTML = '🔐 Enter your new password below.';
        }
        
        // Resend reset link from step 2
        async function resendResetLink() {
            // Get email from session storage or prompt user
            let email = sessionStorage.getItem('resetEmail');
            
            if (!email) {
                email = prompt('Please enter your email address to receive a new reset link:');
                if (!email) return;
            }
            
            const btn = document.getElementById('resendLink');
            const originalText = btn.textContent;
            btn.textContent = 'Sending...';
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            
            try {
                // Use your hosted page URL
                const redirectTo = 'https://amazonquickview.net/reset-password.html';
                
                const response = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email,
                        redirect_to: redirectTo
                    })
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error_description || 'Failed to send');
                }
                
                sessionStorage.setItem('resetEmail', email);
                showSuccess(`New reset link sent to ${email}`);
                
            } catch (error) {
                showError(error.message);
            } finally {
                btn.textContent = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }
        
        // Back to step 1
        function backToStep1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            currentAccessToken = null;
            sessionStorage.removeItem('resetAccessToken');
            sessionStorage.removeItem('resetRefreshToken');
            
            // Clear password fields
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            updateRequirements();
        }
        
        // Open extension
        function openExtension() {
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
                showInfo('Extension opened!');
            } else {
                showInfo('Click the Amazon Quick View Pro icon in your browser toolbar.');
            }
        }
        
        // Initialize page
        function init() {
            // Check if we have a token from the magic link
            const hasToken = parseTokenFromURL();
            
            if (hasToken) {
                showStep2();
            } else {
                // Show step 1 (email entry)
                document.getElementById('step1').classList.add('active');
            }
            
            // Setup real-time validation
            document.getElementById('newPassword').addEventListener('input', updateRequirements);
            document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
            
            // Button click handlers
            document.getElementById('sendResetLinkBtn').addEventListener('click', sendResetLink);
            document.getElementById('updatePasswordBtn').addEventListener('click', updatePassword);
            document.getElementById('backToExtension').addEventListener('click', (e) => {
                e.preventDefault();
                openExtension();
            });
            document.getElementById('backToStep1').addEventListener('click', (e) => {
                e.preventDefault();
                backToStep1();
            });
            document.getElementById('resendLink').addEventListener('click', (e) => {
                e.preventDefault();
                resendResetLink();
            });
            
            // Enter key support
            document.getElementById('email').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendResetLink();
                }
            });
            
            document.getElementById('newPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !document.getElementById('updatePasswordBtn').disabled) {
                    updatePassword();
                }
            });
            document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !document.getElementById('updatePasswordBtn').disabled) {
                    updatePassword();
                }
            });
            
            updateRequirements();
        }
        
        // Start
        init();
    </script>
</body>
</html>
