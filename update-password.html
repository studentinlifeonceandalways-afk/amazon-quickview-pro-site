<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Amazon Quick View Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }
        
        h1 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            background: #fee2e2;
            color: #991b1b;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .info-message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            background: #e0f2fe;
            color: #075985;
            display: none;
        }
        
        .info-message.show {
            display: block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            margin-top: 20px;
            font-size: 12px;
        }
        
        .back-link a {
            color: #ff9900;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .password-requirements {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1>Reset Password</h1>
        <p class="subtitle">Create a new password for your account</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="infoMessage" class="info-message"></div>
        
        <div id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
                <div class="password-requirements">• Minimum 6 characters</div>
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>
            <button id="resetBtn">Reset Password</button>
        </div>
        
        <div class="back-link">
            <a href="#" id="backToExtension">← Back to Extension</a>
        </div>
    </div>

    <script>
        // Supabase configuration - same as your extension
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        // Success page URL only (no failure page)
        const SUCCESS_PAGE_URL = 'https://amazonquickview.net/reset-sucess.html';
        
        // Get the access token from URL hash (Supabase sends it as #access_token=...)
        function getTokenFromHash() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }
        
        // Also check query parameters (alternative format)
        function getTokenFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('access_token');
        }
        
        // Show error message (inline, no redirect)
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            // Hide after 5 seconds
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
        
        // Show info message
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.classList.add('show');
            
            setTimeout(() => {
                infoDiv.classList.remove('show');
            }, 3000);
        }
        
        // Redirect to success page only
        function redirectToSuccess() {
            console.log('[Reset] Redirecting to success page:', SUCCESS_PAGE_URL);
            window.location.replace(SUCCESS_PAGE_URL);
        }
        
        // Update password using Supabase REST API
        async function updatePassword(accessToken, newPassword) {
            const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                method: 'PUT',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    password: newPassword
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.msg || 'Failed to update password');
            }
            
            return await response.json();
        }
        
        // Main reset handler
        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            // Validate
            if (!newPassword || !confirmPassword) {
                showError('Please enter both password fields');
                return;
            }
            
            if (newPassword.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            // Get token from URL
            const accessToken = getTokenFromHash() || getTokenFromQuery();
            
            if (!accessToken) {
                showError('Invalid or expired reset link. Please request a new password reset.');
                return;
            }
            
            // Disable button and show loading
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Updating...';
            
            try {
                await updatePassword(accessToken, newPassword);
                // On success - redirect to success page
                redirectToSuccess();
            } catch (error) {
                let errorMsg = error.message || 'Failed to reset password';
                if (errorMsg.includes('expired')) {
                    errorMsg = 'This reset link has expired. Please request a new one.';
                }
                // On error - show inline message (no redirect)
                showError(errorMsg);
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Reset Password';
            }
        }
        
        // Open Chrome extension
        function openExtension() {
            if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' }).catch(() => {
                    showInfo('Open the extension from your browser toolbar to sign in.');
                });
            } else {
                showInfo('Open the extension from your browser toolbar to sign in.');
            }
        }
        
        // Check for token on load
        function checkTokenOnLoad() {
            const token = getTokenFromHash() || getTokenFromQuery();
            if (!token) {
                showError('Invalid reset link. Please request a new password reset from the extension.');
                document.getElementById('resetBtn').disabled = true;
            } else {
                console.log('[Reset] Valid token found, ready to reset');
                showInfo('Enter your new password below.');
            }
        }
        
        // Event listeners
        document.getElementById('resetBtn').addEventListener('click', handleReset);
        document.getElementById('backToExtension').addEventListener('click', (e) => {
            e.preventDefault();
            openExtension();
        });
        
        // Enter key support
        document.getElementById('newPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleReset();
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleReset();
        });
        
        // Initialize
        checkTokenOnLoad();
    </script>
</body>
</html>
