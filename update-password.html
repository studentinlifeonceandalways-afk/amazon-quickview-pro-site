<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Amazon Quick View Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        
        .reset-header {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            padding: 32px 24px;
            text-align: center;
        }
        
        .reset-header .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .reset-header h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .reset-header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        
        .reset-body {
            padding: 32px 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #dc2626;
        }
        
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #16a34a;
        }
        
        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #0284c7;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        
        .footer-links a {
            color: #ff9900;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .token-status {
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .token-valid { background: #dcfce7; color: #166534; }
        .token-invalid { background: #fee2e2; color: #991b1b; }
        
        .requirement-list {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            padding-left: 16px;
            list-style: none;
        }
        
        .requirement-list li {
            margin-bottom: 4px;
            padding-left: 20px;
            position: relative;
        }
        
        .requirement-list li.valid {
            color: #10b981;
        }
        
        .requirement-list li.valid::before {
            content: '✓';
            position: absolute;
            left: 0;
        }
        
        .requirement-list li.invalid::before {
            content: '○';
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <div class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
                </svg>
            </div>
            <h1>Reset Password</h1>
            <p>Enter your new password below</p>
        </div>
        
        <div class="reset-body">
            <div id="tokenStatus" class="token-status" style="display: none;"></div>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            <div id="infoMessage" class="info-message"></div>
            
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
            </div>
            
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
            </div>
            
            <ul class="requirement-list">
                <li id="req-length">At least 6 characters</li>
                <li id="req-match">Passwords match</li>
            </ul>
            
            <button id="resetBtn" class="btn-primary" disabled>Update Password</button>
            
            <div class="footer-links">
                <a href="#" id="requestNewLink">Request New Reset Link</a>
                <span style="margin: 0 8px; color: #cbd5e1;">|</span>
                <a href="#" id="backToExtension">Open Extension</a>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let accessToken = null;
        let userEmail = null;
        
        // Extract token from URL - handles both hash and query params
        function extractTokenFromUrl() {
            // Try hash first (#access_token=xxx)
            let hashParams = new URLSearchParams(window.location.hash.substring(1));
            let token = hashParams.get('access_token');
            
            // If not in hash, try query params (?access_token=xxx)
            if (!token) {
                let queryParams = new URLSearchParams(window.location.search);
                token = queryParams.get('access_token');
            }
            
            // If still not found, try to extract from the URL path
            if (!token && window.location.pathname.includes('/reset-password/')) {
                const pathSegments = window.location.pathname.split('/');
                const possibleToken = pathSegments[pathSegments.length - 1];
                if (possibleToken && possibleToken.length > 50) {
                    token = possibleToken;
                }
            }
            
            console.log('[Reset] Token found:', !!token);
            return token;
        }
        
        // Validate token with Supabase
        async function validateToken() {
            if (!accessToken) {
                showTokenStatus(false, 'No reset token found. Please request a new reset link.');
                return false;
            }
            
            try {
                console.log('[Reset] Validating token...');
                
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('[Reset] Validation response status:', response.status);
                
                if (response.ok) {
                    const user = await response.json();
                    userEmail = user.email;
                    console.log('[Reset] Token valid for:', userEmail);
                    showTokenStatus(true, `Resetting password for ${userEmail}`);
                    return true;
                } else if (response.status === 403) {
                    // Token expired - clear it and show message
                    accessToken = null;
                    showTokenStatus(false, 'This reset link has expired. Please request a new one.');
                    return false;
                } else {
                    const error = await response.json();
                    console.error('[Reset] Validation error:', error);
                    showTokenStatus(false, error.message || 'Invalid reset link');
                    return false;
                }
            } catch (error) {
                console.error('[Reset] Validation error:', error);
                showTokenStatus(false, 'Unable to validate reset link. Please check your connection.');
                return false;
            }
        }
        
        // Update password using the recovery token
        async function updatePassword(newPassword) {
            if (!accessToken) {
                throw new Error('No valid reset token found');
            }
            
            try {
                console.log('[Reset] Updating password...');
                
                // METHOD 1: Try direct user update
                const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                console.log('[Reset] Update response status:', response.status);
                
                if (response.ok) {
                    return true;
                }
                
                if (response.status === 403 || response.status === 401) {
                    // Token expired - need to verify OTP first
                    console.log('[Reset] Token expired, attempting OTP verification...');
                    return await updatePasswordWithOTP(newPassword);
                }
                
                const error = await response.json();
                throw new Error(error.message || error.error_description || 'Password update failed');
                
            } catch (error) {
                console.error('[Reset] Update error:', error);
                throw error;
            }
        }
        
        // Alternative: Use OTP verification then update
        async function updatePasswordWithOTP(newPassword) {
            // Extract token_hash from URL if present
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            let tokenHash = hashParams.get('token_hash');
            
            if (!tokenHash) {
                const queryParams = new URLSearchParams(window.location.search);
                tokenHash = queryParams.get('token_hash');
            }
            
            if (!tokenHash) {
                throw new Error('Reset link invalid. Please request a new reset link.');
            }
            
            try {
                // First, verify the OTP
                const verifyResponse = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'recovery',
                        token_hash: tokenHash
                    })
                });
                
                if (!verifyResponse.ok) {
                    const error = await verifyResponse.json();
                    throw new Error(error.message || 'OTP verification failed');
                }
                
                const session = await verifyResponse.json();
                
                // Now update with the new session
                const updateResponse = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });
                
                if (!updateResponse.ok) {
                    const error = await updateResponse.json();
                    throw new Error(error.message || 'Password update failed');
                }
                
                return true;
                
            } catch (error) {
                console.error('[Reset] OTP flow error:', error);
                throw error;
            }
        }
        
        // Validate password requirements
        function validatePassword(password, confirm) {
            const lengthValid = password.length >= 6;
            const matchValid = password === confirm && password !== '';
            const isValid = lengthValid && matchValid;
            
            return { isValid, lengthValid, matchValid };
        }
        
        // Update UI requirements
        function updateRequirements() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            const { isValid, lengthValid, matchValid } = validatePassword(password, confirm);
            
            const lengthReq = document.getElementById('req-length');
            const matchReq = document.getElementById('req-match');
            
            if (lengthValid) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.remove('valid');
                lengthReq.classList.add('invalid');
            }
            
            if (matchValid) {
                matchReq.classList.add('valid');
                matchReq.classList.remove('invalid');
            } else {
                matchReq.classList.remove('valid');
                matchReq.classList.add('invalid');
            }
            
            resetBtn.disabled = !isValid;
        }
        
        function showTokenStatus(isValid, message) {
            const statusDiv = document.getElementById('tokenStatus');
            statusDiv.style.display = 'block';
            statusDiv.className = `token-status ${isValid ? 'token-valid' : 'token-invalid'}`;
            statusDiv.innerHTML = isValid ? `✅ ${message}` : `❌ ${message}`;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function showInfo(message) {
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => {
                infoDiv.style.display = 'none';
            }, 4000);
        }
        
        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const { isValid, lengthValid, matchValid } = validatePassword(newPassword, confirmPassword);
            
            if (!isValid) {
                if (!lengthValid) showError('Password must be at least 6 characters');
                else if (!matchValid) showError('Passwords do not match');
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Updating password...';
            
            try {
                await updatePassword(newPassword);
                
                showSuccess('Password updated successfully!');
                
                // Clear sensitive data
                accessToken = null;
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    showInfo('Redirecting to extension login...');
                    // Open the extension
                    if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                        chrome.runtime.sendMessage({ action: 'openSidePanel' });
                    }
                }, 2000);
                
            } catch (error) {
                console.error('[Reset] Error:', error);
                
                if (error.message.includes('expired') || error.message.includes('invalid')) {
                    showError('This reset link has expired. Please request a new one.');
                    document.getElementById('resetBtn').disabled = true;
                } else {
                    showError(error.message || 'Failed to update password');
                    // Re-enable button
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Update Password';
                }
            }
        }
        
        function requestNewLink() {
            showInfo('Please open the Amazon Quick View Pro extension and click "Forgot Password?" to request a new link.');
            
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
            }
        }
        
        function openExtension() {
            if (chrome && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage({ action: 'openSidePanel' });
                showInfo('Extension opened! Look for the Amazon Quick View Pro icon in your browser toolbar.');
            } else {
                showInfo('Click the Amazon Quick View Pro icon in your browser toolbar to open the extension.');
            }
        }
        
        async function init() {
            console.log('[Reset] Initializing...');
            
            accessToken = extractTokenFromUrl();
            
            if (!accessToken) {
                showTokenStatus(false, 'No reset token found. Please request a new reset link from the extension.');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            // Add a delay to ensure any prefetching has completed
            setTimeout(async () => {
                const isValid = await validateToken();
                if (isValid) {
                    const resetBtn = document.getElementById('resetBtn');
                    resetBtn.disabled = false;
                }
            }, 500);
        }
        
        // Event listeners
        document.getElementById('resetBtn').addEventListener('click', handleReset);
        document.getElementById('newPassword').addEventListener('input', updateRequirements);
        document.getElementById('confirmPassword').addEventListener('input', updateRequirements);
        document.getElementById('requestNewLink').addEventListener('click', (e) => {
            e.preventDefault();
            requestNewLink();
        });
        document.getElementById('backToExtension').addEventListener('click', (e) => {
            e.preventDefault();
            openExtension();
        });
        
        // Enter key support
        document.getElementById('newPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                handleReset();
            }
        });
        document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('resetBtn').disabled) {
                handleReset();
            }
        });
        
        // Start
        init();
    </script>
</body>
</html>
