<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Amazon Quick View Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4fa 0%, #e9eef5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 24px;
            padding: 32px 28px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .logo-icon svg {
            width: 28px;
            height: 28px;
        }
        
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff9900;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ff9900;
            text-decoration: none;
            font-size: 12px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #e0f2fe;
            color: #0284c7;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z" fill="white"/>
            </svg>
        </div>
        
        <h1>Reset Password</h1>
        <p class="subtitle">Create a new password for your account</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="infoMessage" class="info-box" style="display: none;"></div>
        
        <div id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>
            <button id="resetBtn" class="btn-primary">Reset Password</button>
        </div>
        
        <a href="chrome-extension://YOUR_EXTENSION_ID/login.html" class="back-link" id="backLink">← Back to Extension</a>
    </div>

    <script>
        // Supabase configuration (same as your extension)
        const SUPABASE_URL = 'https://lmjkxlsxebozfqhwcscu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtamt4bHN4ZWJvemZxaHdjc2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMTUwMzcsImV4cCI6MjA5NDg5MTAzN30.YSfksfI3m4AuVMeDt3zvAW5s0S_9rlEWMUleonre04U';
        
        let accessToken = null;
        let refreshToken = null;
        
        // Get tokens from URL fragment (Supabase returns #access_token=xxx)
        function getTokensFromUrl() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            
            accessToken = params.get('access_token');
            refreshToken = params.get('refresh_token');
            const type = params.get('type');
            
            console.log('[Reset] Tokens from URL:', { accessToken: !!accessToken, type });
            
            if (type === 'recovery') {
                document.getElementById('infoMessage').style.display = 'block';
                document.getElementById('infoMessage').innerHTML = '✅ Recovery link verified. Please enter your new password below.';
                return true;
            }
            
            // Also check query params (alternative format)
            const queryParams = new URLSearchParams(window.location.search);
            const token = queryParams.get('token');
            if (token) {
                accessToken = token;
                return true;
            }
            
            return false;
        }
        
        // Update password using Supabase API
        async function updatePassword(newPassword) {
            if (!accessToken) {
                throw new Error('No recovery token found. Please request a new reset link.');
            }
            
            const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                method: 'PUT',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: newPassword })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.message || data.error_description || 'Failed to update password');
            }
            
            return data;
        }
        
        // Handle reset button click
        async function handleReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Clear previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validate
            if (!newPassword || newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loading-spinner"></span> Updating...';
            
            try {
                await updatePassword(newPassword);
                
                successDiv.textContent = '✅ Password updated successfully! Redirecting to extension...';
                successDiv.style.display = 'block';
                document.getElementById('resetForm').style.display = 'none';
                
                // Store in localStorage to auto-fill login?
                localStorage.setItem('reset_password_success', 'true');
                
                // Redirect to extension after 3 seconds
                setTimeout(() => {
                    // Try to open the extension
                    window.location.href = 'chrome-extension://YOUR_EXTENSION_ID/login.html';
                }, 3000);
                
            } catch (error) {
                console.error('[Reset] Error:', error);
                errorDiv.textContent = error.message || 'Failed to reset password. Please request a new link.';
                errorDiv.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Reset Password';
            }
        }
        
        // Initialize
        function init() {
            const hasTokens = getTokensFromUrl();
            
            if (!hasTokens) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = 'Invalid or expired reset link. Please request a new password reset.';
                errorDiv.style.display = 'block';
                document.getElementById('resetForm').style.display = 'none';
                return;
            }
            
            // Add event listener to reset button
            document.getElementById('resetBtn').addEventListener('click', handleReset);
            
            // Enter key support
            document.getElementById('newPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleReset();
            });
            document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleReset();
            });
        }
        
        init();
    </script>
</body>
</html>
