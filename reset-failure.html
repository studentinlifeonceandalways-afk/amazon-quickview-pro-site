<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset Failed - Amazon Quick View Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .container {
            background: white;
            border-radius: 32px;
            padding: 48px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease-out 0.2s both;
        }
        
        .failure-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: shake 0.5s ease-out 0.1s both;
        }
        
        .failure-icon svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 2;
        }
        
        h1 {
            font-size: 26px;
            color: #1e293b;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .message {
            color: #475569;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        .error-detail {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin: 20px 0;
            word-break: break-word;
        }
        
        .redirect-timer {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #eef2f6;
        }
        
        .dots {
            display: inline-block;
            width: 24px;
            text-align: left;
        }
        
        @keyframes blink {
            0%, 20% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .dot {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }
        
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="failure-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <h1>Reset Failed</h1>
        
        <div class="message">
            We couldn't reset your password.
        </div>
        
        <div id="errorDetail" class="error-detail">
            The reset link may have expired or is invalid.
        </div>
        
        <div class="redirect-timer">
            Closing in <span id="timer">5</span> seconds<span class="dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
        </div>
    </div>

    <script>
        // Get error message from URL parameter if available
        const urlParams = new URLSearchParams(window.location.search);
        const errorMsg = urlParams.get('error');
        
        if (errorMsg) {
            const errorElement = document.getElementById('errorDetail');
            if (errorElement) {
                let displayMessage = errorMsg;
                if (errorMsg.includes('expired')) {
                    displayMessage = 'This reset link has expired. Please request a new password reset from the extension.';
                } else if (errorMsg.includes('token')) {
                    displayMessage = 'Invalid reset token. Please request a new password reset.';
                }
                errorElement.textContent = displayMessage;
            }
        }
        
        // Auto-close the tab/window after 5 seconds
        let secondsLeft = 5;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            secondsLeft--;
            if (timerElement) {
                timerElement.textContent = secondsLeft;
            }
            
            if (secondsLeft <= 0) {
                clearInterval(countdown);
                window.close();
            }
        }, 1000);
        
        // Also close after 5 seconds (fallback)
        setTimeout(() => {
            window.close();
        }, 5000);
    </script>
</body>
</html>
